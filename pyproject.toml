[project]
name = "manufacture-examples"
version = "0.1.0"
description = "Example pipelines and modules for Manufacture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["manufacture-sdk"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# Pinned SDK commit; keep in sync with SDK_REF in versions.env.
manufacture-sdk = { git = "https://github.com/t1menar/manufacture-sdk-python", rev = "d7caeca7a3a39cb41b76cd118fca91b7e73636bb" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: module docstrings only, as in the SDK
    "COM812",  # conflicts with the formatter
    "CPY001",
    "E501",    # the formatter owns line length
    "INP001",  # modules are run as scripts in their images
    "ARG001",  # handler signatures are fixed by the SDK: (ctx, inp)
]

[tool.ruff.lint.per-file-ignores]
"hello-world/modules/exclaim/main.py" = ["T201"]  # printing the result is the point
"e2e/hello_world_e2e.py" = ["T201", "ANN401", "TRY003", "EM101", "EM102", "PLR2004", "N818"]
"**/tests/**" = ["S101", "ANN", "PLR2004", "PLC0415", "TC001", "TC002", "TC003", "C901", "PLR0911", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["modules", "e2e"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["hello-world", "e2e"]
mypy_path = "hello-world:."
explicit_package_bases = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["hello-world/tests", "e2e/tests"]
pythonpath = ["hello-world", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
