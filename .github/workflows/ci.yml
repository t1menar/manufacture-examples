name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly e2e against the pinned versions
  workflow_dispatch:
    inputs:
      core_image:
        description: "Core image for the e2e (default: CORE_IMAGE in versions.env)"
        required: false
      sdk_ref:
        description: "SDK commit for the module images (default: SDK_REF in versions.env)"
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest -v

  validate:
    # `manufacture validate --strict` from manufacture-core at CORE_REF (versions.env).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: manufacture validate
        run: make validate

  images:
    # The module images build from the pinned SDK and load their module.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: make -C hello-world images
      - name: smoke
        run: make -C hello-world manifests

  e2e:
    # Hello World on docker compose (e2e/run.sh). Until manufacture-core publishes a runnable
    # image (CORE_IMAGE in versions.env is empty) this checks the infrastructure and the module
    # images only and reports the core part as skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: e2e/run.sh
        env:
          CORE_IMAGE: ${{ inputs.core_image || '' }}
          SDK_REF_OVERRIDE: ${{ inputs.sdk_ref || '' }}
        run: |
          if [ -n "$SDK_REF_OVERRIDE" ]; then export SDK_REF="$SDK_REF_OVERRIDE"; fi
          if [ -z "$CORE_IMAGE" ]; then unset CORE_IMAGE; fi
          e2e/run.sh
