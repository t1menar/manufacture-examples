# Hello World end-to-end stack (design doc §1.4, §10.3): core + PostgreSQL + RabbitMQ + MinIO,
# plus a local registry for the module images. Credentials here are throwaway, local-only
# values; the admin token is generated by e2e/run.sh and never printed.
#
#   e2e/run.sh            # does everything; see e2e/README.md
#
# The `core` service is in the `core` profile because no runnable core image exists yet
# (CORE_IMAGE in versions.env is empty until manufacture-core C6).
name: mf-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mf
      POSTGRES_PASSWORD: mf
      POSTGRES_DB: mf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mf -d mf"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["127.0.0.1:${E2E_AMQP_PORT:-5672}:5672", "127.0.0.1:${E2E_RMQ_UI_PORT:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 10s
      retries: 40

  minio:
    # MinIO stopped publishing minio/minio (Docker Hub, Quay) in 2025-2026; Chainguard's free,
    # distroless build is the drop-in replacement (no shell: health is probed by run.sh).
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/tmp/minio-data", "--console-address", ":9001"] # runs as uid 65532
    environment:
      MINIO_ROOT_USER: mf-e2e
      MINIO_ROOT_PASSWORD: mf-e2e-local-only
    ports: ["127.0.0.1:${E2E_S3_PORT:-9000}:9000"]

  minio-init:
    # Creates the claim-check bucket (MF_S3_BUCKET default `mf-blobs`), retrying until MinIO is up.
    image: amazon/aws-cli:latest
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: mf-e2e
      AWS_SECRET_ACCESS_KEY: mf-e2e-local-only
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          if aws --endpoint-url http://minio:9000 s3api head-bucket --bucket mf-blobs 2>/dev/null \
             || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket mf-blobs >/dev/null 2>&1; then
            echo "bucket mf-blobs ready"; exit 0
          fi
          sleep 1
        done
        echo "MinIO did not come up" >&2; exit 1
    restart: "no"

  registry:
    # localhost:5001, the registry the Module specs point at (images built by hello-world/Makefile).
    image: registry:2
    ports: ["127.0.0.1:5001:5000"]

  core:
    profiles: [core]
    image: ${CORE_IMAGE:-core-image-not-set} # run.sh refuses to start the core without CORE_IMAGE
    command: ["serve"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      MF_LISTEN_ADDR: 0.0.0.0:8080
      MF_DATABASE_URL: postgres://mf:mf@postgres:5432/mf?sslmode=disable
      MF_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      MF_S3_ENDPOINT: minio:9000
      MF_S3_ACCESS_KEY: mf-e2e
      MF_S3_SECRET_KEY: mf-e2e-local-only
      MF_S3_BUCKET: mf-blobs
      MF_RUNTIME: docker
      MF_ADMIN_TOKEN: ${MF_ADMIN_TOKEN:-} # generated by e2e/run.sh
      MF_LOG_FORMAT: json
      # Expected from the docker driver (C6): start module containers on this network so
      # they reach rabbitmq/minio by service name. Name to be confirmed by the core.
      MF_DOCKER_NETWORK: mf-e2e_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:${E2E_CORE_PORT:-8080}:8080"]
    # No container healthcheck: the image may be distroless; run.sh polls /readyz.
