# Hello World end-to-end stack (design doc §1.4, §10.3): core + PostgreSQL + RabbitMQ + MinIO,
# plus a local registry for the module images. Credentials here are throwaway, local-only
# values; the admin token is generated by e2e/run.sh and never printed.
#
#   e2e/run.sh            # does everything; see e2e/README.md
#
# The `core` service is in the `core` profile because no runnable core image exists yet
# (CORE_IMAGE in versions.env is empty until manufacture-core C6).
name: mf-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mf
      POSTGRES_PASSWORD: mf
      POSTGRES_DB: mf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mf -d mf"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["127.0.0.1:${E2E_AMQP_PORT:-5672}:5672", "127.0.0.1:${E2E_RMQ_UI_PORT:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 10s
      retries: 40

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: mf-e2e
      MINIO_ROOT_PASSWORD: mf-e2e-local-only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    # Creates the claim-check bucket (MF_S3_BUCKET default `mf-blobs`).
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set e2e http://minio:9000 mf-e2e mf-e2e-local-only && mc mb --ignore-existing e2e/mf-blobs
    restart: "no"

  registry:
    # localhost:5001, the registry the Module specs point at (images built by hello-world/Makefile).
    image: registry:2
    ports: ["127.0.0.1:5001:5000"]

  core:
    profiles: [core]
    image: ${CORE_IMAGE:-core-image-not-set} # run.sh refuses to start the core without CORE_IMAGE
    command: ["serve"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      MF_LISTEN_ADDR: 0.0.0.0:8080
      MF_DATABASE_URL: postgres://mf:mf@postgres:5432/mf?sslmode=disable
      MF_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      MF_S3_ENDPOINT: minio:9000
      MF_S3_ACCESS_KEY: mf-e2e
      MF_S3_SECRET_KEY: mf-e2e-local-only
      MF_S3_BUCKET: mf-blobs
      MF_RUNTIME: docker
      MF_ADMIN_TOKEN: ${MF_ADMIN_TOKEN:-} # generated by e2e/run.sh
      MF_LOG_FORMAT: json
      # Expected from the docker driver (C6): start module containers on this network so
      # they reach rabbitmq/minio by service name. Name to be confirmed by the core.
      MF_DOCKER_NETWORK: mf-e2e_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:${E2E_CORE_PORT:-8080}:8080"]
    # No container healthcheck: the image may be distroless; run.sh polls /readyz.
